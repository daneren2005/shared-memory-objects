name: Tests

on:
  push:
    branches-ignore: [production]
  pull_request:
    branches: [dev]
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to use
        type: string
        default: '24'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version || '24' }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test:unit

      - name: Build
        run: npm run build
